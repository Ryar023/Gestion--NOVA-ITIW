<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cuenta | NOVA GESTION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7b6eea 0%, #6e4cc7 100%);
            padding: 2rem 0;
        }
        .auth-card { max-width: 500px; width: 100%; box-shadow: 0 0 24px #0001; border-radius: 16px; background: #fff; padding: 2rem; }
        .auth-logo { width: 90px; display: block; margin: 0 auto 1rem; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px #0002; }
        .auth-button { width: 100%; }
        .link-button { background: none; border: none; color: #0d6efd; text-decoration: underline; cursor: pointer; }
        .password-input-wrapper { position: relative; }
        .password-toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; }
        .error-msg { color: #dc3545; font-size: 0.85em; margin-top: 0.25rem; display: block; }
        .is-invalid { border-color: #dc3545 !important; }
    </style>
</head>
<body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header text-center mb-4">
          <img src="/static/img/logo.png" alt="Logo NOVA GESTION" class="auth-logo" />
          <h2>Solicitar Cuenta</h2>
          <p class="text-muted">Completa el formulario para solicitar una cuenta</p>
        </div>
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
          {% endfor %}
        {% endif %}
        <form method="post" class="auth-form" id="solicitudForm">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nombre" class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ingresa tu nombre">
              <span class="error-msg" id="nombreError"></span>
            </div>
            <div class="col-md-6 mb-3">
              <label for="apellido" class="form-label">Apellido *</label>
              <input type="text" class="form-control" id="apellido" name="apellido" required placeholder="Ingresa tu apellido">
              <span class="error-msg" id="apellidoError"></span>
            </div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico *</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="Ingresa tu correo">
            <span class="error-msg" id="emailError"></span>
          </div>
          <div class="mb-3">
            <label for="telefono" class="form-label">Número Telefónico *</label>
            <input type="text" class="form-control" id="telefono" name="telefono" required placeholder="Ingresa tu teléfono">
            <span class="error-msg" id="telefonoError"></span>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="ciudad" class="form-label">Ciudad *</label>
              <input type="text" class="form-control" id="ciudad" name="ciudad" required placeholder="Tu ciudad">
              <span class="error-msg" id="ciudadError"></span>
            </div>
            <div class="col-md-6 mb-3">
              <label for="distrito" class="form-label">Distrito *</label>
              <input type="text" class="form-control" id="distrito" name="distrito" required placeholder="Tu distrito">
              <span class="error-msg" id="distritoError"></span>
            </div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña *</label>
            <div class="password-input-wrapper">
              <input type="password" class="form-control" id="password" name="password" required placeholder="Crea una contraseña">
              <button type="button" class="password-toggle-btn" onclick="togglePassword('password', 'eyeIcon')" tabindex="-1">
                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label for="password_confirm" class="form-label">Confirmar Contraseña *</label>
            <input type="password" class="form-control" id="password_confirm" name="password_confirm" required placeholder="Confirma tu contraseña">
            <span class="error-msg" id="passwordConfirmError"></span>
          </div>
          <button type="submit" class="btn btn-primary auth-button">Enviar Solicitud</button>
        </form>
        <div class="auth-footer text-center mt-3">
          <p><a href="/login/" class="link-button">Volver al login</a></p>
        </div>
      </div>
    </div>
    <script>
      function togglePassword(fieldId, iconId) {
        const pwd = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (pwd.type === 'password') {
          pwd.type = 'text';
          icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
          pwd.type = 'password';
          icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
      }

      function validarNombre(valor) {
        return /^[a-záéíóúñ\s]{2,}$/i.test(valor);
      }

      function validarEmail(valor) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor);
      }

      function validarTelefono(valor) {
        return /^\d{1,9}$/.test(valor);
      }

      function validarTexto(valor) {
        return /^[a-záéíóúñ\s]{2,}$/i.test(valor);
      }

      document.addEventListener('DOMContentLoaded', function() {
        // Nombre
        const nombreInput = document.getElementById('nombre');
        if (nombreInput) {
          nombreInput.addEventListener('input', function() {
            const error = document.getElementById('nombreError');
            if (this.value && !validarNombre(this.value)) {
              error.textContent = 'Solo letras, mínimo 2 caracteres';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Apellido
        const apellidoInput = document.getElementById('apellido');
        if (apellidoInput) {
          apellidoInput.addEventListener('input', function() {
            const error = document.getElementById('apellidoError');
            if (this.value && !validarNombre(this.value)) {
              error.textContent = 'Solo letras, mínimo 2 caracteres';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Email
        const emailInput = document.getElementById('email');
        if (emailInput) {
          emailInput.addEventListener('input', function() {
            const error = document.getElementById('emailError');
            if (this.value && !validarEmail(this.value)) {
              error.textContent = 'Correo inválido (debe incluir @)';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Teléfono
        const telefonoInput = document.getElementById('telefono');
        if (telefonoInput) {
          telefonoInput.addEventListener('input', function() {
            const error = document.getElementById('telefonoError');
            if (this.value && !validarTelefono(this.value)) {
              error.textContent = 'Solo números, máximo 9 dígitos';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Ciudad
        const ciudadInput = document.getElementById('ciudad');
        if (ciudadInput) {
          ciudadInput.addEventListener('input', function() {
            const error = document.getElementById('ciudadError');
            if (this.value && !validarTexto(this.value)) {
              error.textContent = 'Solo letras, mínimo 2 caracteres';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Distrito
        const distritoInput = document.getElementById('distrito');
        if (distritoInput) {
          distritoInput.addEventListener('input', function() {
            const error = document.getElementById('distritoError');
            if (this.value && !validarTexto(this.value)) {
              error.textContent = 'Solo letras, mínimo 2 caracteres';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Confirmación de contraseña
        const passwordConfirmInput = document.getElementById('password_confirm');
        if (passwordConfirmInput) {
          passwordConfirmInput.addEventListener('input', function() {
            const error = document.getElementById('passwordConfirmError');
            const password = document.getElementById('password').value;
            if (this.value && this.value !== password) {
              error.textContent = 'Las contraseñas no coinciden';
              this.classList.add('is-invalid');
            } else {
              error.textContent = '';
              this.classList.remove('is-invalid');
            }
          });
        }

        // Submit form
        const form = document.getElementById('solicitudForm');
        if (form) {
          form.addEventListener('submit', function(e) {
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const ciudad = document.getElementById('ciudad').value;
            const distrito = document.getElementById('distrito').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            if (!validarNombre(nombre) || !validarNombre(apellido) || !validarEmail(email) || 
                !validarTelefono(telefono) || !validarTexto(ciudad) || !validarTexto(distrito) || 
                password !== passwordConfirm || !password) {
              e.preventDefault();
              return false;
            }
          });
        }
      });
    </script>
</body>
</html>
